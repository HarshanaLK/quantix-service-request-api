
name: Deploy Laravel API to EC2

on:
  workflow_run:
    workflows: ["API tests (MySQL)"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: quantix-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}

    runs-on: [self-hosted, linux, X64, quantix-api-prod]
    timeout-minutes: 35

    steps:
      - name: Deploy Laravel to EC2
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          sudo -n /usr/local/bin/deploy-quantix-api "$COMMIT_SHA"
